<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acompanhamento da tíbia · demonstração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EC; --surface:#FFFFFF; --ink:#233122; --ink2:#3F4B3C; --muted:#566352; --faint:#8A9486;
  --line:#E4E1D8; --line2:#D9D6CC; --gold:#B8893A; --gold-ink:#8A6224; --chip:#EDE9DF;
  --primary:#233122; --on-primary:#FFFFFF; --legbg:#F5F3EC;
  --p1:#F7D9C8; --p2:#EDA27C; --p3:#B5532D; --t1:#5A2410; --t2:#4A1E0C; --t3:#FFFFFF;
  --err:#9B2C1E;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151C14; --surface:#1F281E; --ink:#ECEFE8; --ink2:#D3D9CF; --muted:#AAB3A6; --faint:#879183;
    --line:#2F3A2D; --line2:#3D4A3A; --gold:#D4A65A; --gold-ink:#D9B26C; --chip:#2A3428;
    --primary:#ECEFE8; --on-primary:#151C14; --legbg:#E9EDE4; --err:#F09A8A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151C14; --surface:#1F281E; --ink:#ECEFE8; --ink2:#D3D9CF; --muted:#AAB3A6; --faint:#879183;
  --line:#2F3A2D; --line2:#3D4A3A; --gold:#D4A65A; --gold-ink:#D9B26C; --chip:#2A3428;
  --primary:#ECEFE8; --on-primary:#151C14; --legbg:#E9EDE4; --err:#F09A8A;
  color-scheme: dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2{font-family:'Nunito','Manrope',system-ui,sans-serif;font-weight:800;margin:0;color:var(--ink)}
h1{font-size:26px;line-height:1.15}
h2{font-size:19px;line-height:1.25}
p{margin:0}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:24px 20px 112px;display:flex;flex-direction:column;gap:16px;min-height:100%}
.head{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:13px;font-weight:700;color:var(--gold-ink)}
.lead{font-size:14px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.hero{background:var(--primary);color:var(--on-primary);border:none}
.hero h2{color:var(--on-primary);font-size:21px}
.hero p{color:var(--on-primary);opacity:.82;font-size:14px}
.btn{min-height:52px;border-radius:14px;border:none;background:var(--primary);color:var(--on-primary);font-size:16px;font-weight:700;width:100%;display:flex;align-items:center;justify-content:center;padding:0 16px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line2)}
.hero .btn{background:var(--on-primary);color:var(--primary)}
.hero .btn.ghost{background:transparent;color:var(--on-primary);border:1px solid rgba(255,255,255,.35)}
:root[data-theme="dark"] .hero .btn.ghost{border-color:rgba(0,0,0,.3)}
.row{display:flex;gap:10px}
.seg.tipos{display:grid;grid-template-columns:1fr 1fr}
.row>.btn{flex:1}
.lbl{font-size:14px;font-weight:700;margin-bottom:8px;display:block}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:0;min-height:44px;padding:6px 8px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font-size:14px;font-weight:600;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.scale{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:3px}
.scale button{height:44px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);font-size:13px;font-weight:700;padding:0}
.scale button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.scale.pain button[aria-pressed="true"]{background:var(--p3);border-color:var(--p3);color:#fff}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.field{display:flex;flex-direction:column;gap:6px;flex:1}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input{height:48px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);padding:0 12px;font-family:inherit;font-size:18px;font-weight:700;width:100%}
.chip{font-size:12px;font-weight:700;color:var(--muted);background:var(--chip);border-radius:999px;padding:4px 10px;white-space:nowrap}
.chip.on{background:var(--gold-ink);color:#fff}
.weekly{border:2px solid var(--gold);text-align:left;width:100%;font-size:inherit}
.weekly.done{border:1px solid var(--line)}
.linkrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.foot{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-top:8px}
.foot .credit{font-size:11px;font-weight:600;color:var(--faint)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
.tabs .in{display:flex;max-width:480px;width:100%}
.tab{flex:1;min-height:48px;border:none;background:transparent;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tab[aria-current="page"]{color:var(--ink)}
.bar{display:flex;gap:6px}
.bar span{flex:1;height:6px;border-radius:3px;background:var(--line2)}
.bar span.on{background:var(--gold)}
.pin{display:flex;gap:6px}
.pin button{flex:1;min-width:0;min-height:44px;padding:0 4px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.pin button[aria-pressed="true"]{border:2px solid var(--ink)}
.pin .sw{width:16px;height:12px;border-radius:6px;display:inline-block;flex-shrink:0}
.pin button{font-size:12.5px}
.legcard{background:var(--legbg);border-radius:16px;padding:12px 0;display:flex;justify-content:center;position:relative;overflow:hidden}
.legcard .tag{position:absolute;left:14px;font-size:12px;font-weight:700;color:#566352}
.legbox{position:relative;width:200px;height:520px}
.legbox svg{position:absolute;inset:0;width:100%;height:100%}
.band{position:absolute;left:-75px;width:350px;height:6.044%;border:none;background:transparent;padding:0}
.band .pill{position:absolute;left:125.3px;width:64px;top:8%;height:84%;border-radius:999px;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#566352}
.band[data-l="1"] .pill{background:var(--p1);color:var(--t1);font-weight:800}
.band[data-l="2"] .pill{background:var(--p2);color:var(--t2);font-weight:800}
.band[data-l="3"] .pill{background:var(--p3);color:var(--t3);font-weight:800}
.band:focus-visible{outline:none}
.band:focus-visible .pill{outline:3px solid var(--gold);outline-offset:1px}
.legtab{display:flex;flex-direction:column;align-items:center;gap:2px}
.legtab small{font-size:12px;font-weight:600;opacity:.8}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);font-size:15px;font-weight:600;text-align:left;width:100%}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--faint);flex-shrink:0}
.opt[aria-pressed="true"]{border:2px solid var(--ink)}
.opt[aria-pressed="true"] .dot{border:6px solid var(--ink)}
.days{display:flex;gap:4px}
.day{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted);text-align:center;line-height:1.25}
.day .p{width:28px;height:28px;border-radius:50%;border:1.5px dashed var(--line2)}
.day .p.l0{border:1.5px solid var(--faint);background:var(--surface)}
.day .p.l1{border:none;background:var(--p1)}
.day .p.l2{border:none;background:var(--p2)}
.day .p.l3{border:none;background:var(--p3)}
.day .p.rest{border:none;background:var(--chip)}
.day .p.fut{border:1.5px dotted var(--line2);opacity:.5}
.day .km{color:var(--ink);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:5px;display:inline-block}
.minis{display:flex;flex-direction:column;gap:12px}
.mini{position:relative;width:46px;height:120px;background:var(--legbg);border-radius:10px;flex-shrink:0}
.mini svg{position:absolute;inset:0;width:100%;height:100%}
.note{font-size:12px;color:var(--muted);text-align:center}
.banner{background:var(--chip);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink2)}
.err{color:var(--err);font-size:13px;font-weight:600}
.done-mark{width:64px;height:64px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;align-self:center;margin-top:24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--bg);border-radius:12px;padding:12px}
.tile b{display:block;font-family:'Nunito','Manrope',sans-serif;font-weight:800;font-size:22px;line-height:1.1}
.tile span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.reltab{border-collapse:collapse;width:100%;font-size:13px}
.reltab th{text-align:left;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line2);padding:6px 8px 6px 0;white-space:nowrap}
.reltab td{border-bottom:1px solid var(--line);padding:7px 8px 7px 0;vertical-align:top}
.pontos{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.relpdf .card{border:1px solid #E4E1D8}
.relpdf h1{font-size:30px}
@media (prefers-reduced-motion: no-preference){
  .screen{animation:in .18s ease-out}
  @keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
}
</style>
</head>

<script>
(function(){
'use strict';
// ---------- constantes ----------
var Y0=332, STEP=27.5, H=23, VB_Y=248, VB_H=455;
var NIVEL=['sem desconforto','leve','moderado','forte'];
var TIPOS=[['rodagem','Rodagem'],['intervalado','Intervalado'],['longo','Longo'],['prova','Prova']];
var QUANDO=[['antes','Antes'],['durante','Durante'],['depois','Depois'],['todo','O tempo todo']];
var MUDOU=[['nao','Não'],['reduzi','Diminuí ritmo ou distância'],['parei','Parei']];
var CAMINHAR=[['nao','Não'],['pouco','Um pouco'],['sim','Sim']];
var INICIO=[['gradual','Aos poucos'],['subito','De repente']];
// OSTRC-BR: texto oficial entra após autorização dos autores. Pontuação conforme Pimenta, Hespanhol e Lopes (2021).
var OSTRC=[
  {q:'[Pergunta 1 do OSTRC-BR: participação em treinos e competições]', pts:[0,8,17,25]},
  {q:'[Pergunta 2 do OSTRC-BR: redução do volume de treino]', pts:[0,6,13,19,25]},
  {q:'[Pergunta 3 do OSTRC-BR: efeito no desempenho]', pts:[0,6,13,19,25]},
  {q:'[Pergunta 4 do OSTRC-BR: intensidade dos sintomas]', pts:[0,8,17,25]}
];

// ---------- estado ----------
var S={
  db:null, user:null, uid:null, ready:false, offline:false, readOnly:false,
  perfil:null, treinos:[], semanais:{}, msg:null,
  screen:'hoje', draft:null, sem:null, saving:false, error:'',
  rel:{versao:'atleta'}, obs:{}, nome:'Atleta da demonstração', relMsg:'', exportando:false
};
var app=document.getElementById('app');
var tabs=document.getElementById('tabs');
var LEG=document.getElementById('legsvg').content.querySelector('svg').innerHTML;

// ---------- utilidades ----------
function pad(n){return String(n).padStart(2,'0')}
function isoLocal(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function hoje(){return isoLocal(new Date())}
function domingoDe(iso){var p=iso.split('-');var x=new Date(+p[0],+p[1]-1,+p[2]);x.setDate(x.getDate()-x.getDay());return isoLocal(x)}
function somaDias(iso,n){var p=iso.split('-');var x=new Date(+p[0],+p[1]-1,+p[2]);x.setDate(x.getDate()+n);return isoLocal(x)}
function rotuloSemana(ini){var p=ini.split('-'),a=new Date(+p[0],+p[1]-1,+p[2]),b=new Date(+p[0],+p[1]-1,+p[2]+6);return periodo(a,b)}
// Avaliação semanal: a semana vai de domingo a sábado. O questionário de uma semana abre no sábado e fica aberto até a segunda seguinte.
function semanaAvaliavel(){
  var h=hoje(), dow=new Date().getDay(), cur=domingoDe(h), prev=somaDias(cur,-7);
  if(S.demo){if(!S.semanais[prev]&&S.treinos.some(function(x){return x.data>=prev&&x.data<cur}))return prev;return S.semanais[cur]?null:cur}
  if(dow===6&&!S.semanais[cur])return cur;
  if((dow===0||dow===1)&&!S.semanais[prev])return prev;
  return null;
}
function semanaRespondidaRecente(){var cur=domingoDe(hoje()),prev=somaDias(cur,-7),dow=new Date().getDay();if(S.demo){if(S.semanais[cur])return cur;if(S.semanais[prev])return prev;return null}if(S.semanais[cur])return cur;if((dow===0||dow===1)&&S.semanais[prev])return prev;return null}
function isoWeek(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);var y=t.getUTCFullYear();var w=Math.ceil(((t-Date.UTC(y,0,1))/86400000+1)/7);return y+'-W'+pad(w)}
var DIAS=['dom','seg','ter','qua','qui','sex','sáb'];
var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var DIAS_LONGO=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
function dataLonga(d){return DIAS_LONGO[d.getDay()]+', '+d.getDate()+' de '+MESES[d.getMonth()]}
function nivelDor(n){if(n==null)return 0; if(n<=0)return 0; if(n<=3)return 1; if(n<=6)return 2; return 3}
function num(v){var x=parseFloat(String(v||'').replace(',','.'));return isFinite(x)?x:null}
function fmtKm(x){return (Math.round(x*10)/10).toString().replace('.',',')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pressed(b){return b?'true':'false'}
function segHtml(opts,val,act,extra){return '<div class="seg" role="group">'+opts.map(function(o){return '<button type="button" data-act="'+act+'" data-v="'+o[0]+'"'+(extra||'')+' aria-pressed="'+pressed(val===o[0])+'">'+o[1]+'</button>'}).join('')+'</div>'}

function pernasMarcadas(d){return ['dir','esq'].filter(function(p){return Object.keys(d.faixas[p]).length>0})}
function resumoFaixas(f){
  var ks=Object.keys(f).map(Number).sort(function(a,b){return a-b});
  if(!ks.length)return 'nada marcado';
  var txt;
  if(ks.length===1) txt='faixa '+ks[0];
  else if(ks.length===2) txt='faixas '+ks[0]+' e '+ks[1];
  else if(ks[ks.length-1]-ks[0]===ks.length-1) txt='faixas '+ks[0]+' a '+ks[ks.length-1];
  else txt='faixas '+ks.slice(0,-1).join(', ')+' e '+ks[ks.length-1];
  if(ks.length>1){
    var max=Math.max.apply(null,ks.map(function(k){return f[k]}));
    var topo=ks.filter(function(k){return f[k]===max});
    if(topo.length===1) txt+=', mais forte na '+topo[0];
  }
  return txt;
}

function localDB(){
  var KEY='tibia-demo-v1', data={}, subs=[];
  try{data=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){data={}}
  function pai(k){return k.split('/').slice(0,-1).join('/')}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){} subs.forEach(function(f){f()})}
  function snap(p){var d=data[p];return {id:p.split('/').pop(),exists:d!==undefined,data:function(){return d}}}
  function consulta(c,ord,lim){
    var docs=Object.keys(data).filter(function(k){return pai(k)===c}).map(snap);
    if(ord)docs.sort(function(a,b){return String(b.data()[ord]||'').localeCompare(String(a.data()[ord]||''))});
    docs=docs.slice(0,lim||1e9);
    return {docs:docs,empty:!docs.length,size:docs.length};
  }
  function doc(p){return {
    set:function(d){data[p]=JSON.parse(JSON.stringify(d));persist();return Promise.resolve()},
    onSnapshot:function(fn){var f=function(){fn(snap(p))};subs.push(f);setTimeout(f,0);return function(){}}
  }}
  function collection(c){var o={_o:null,_l:null,
    orderBy:function(f){o._o=f;return o},
    limit:function(n){o._l=n;return o},
    onSnapshot:function(fn){var f=function(){fn(consulta(c,o._o,o._l))};subs.push(f);setTimeout(f,0);return function(){}},
    add:function(d){data[c+'/'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)]=JSON.parse(JSON.stringify(d));persist();return Promise.resolve()}
  };return o}
  return {doc:doc,collection:collection,reset:function(){Object.keys(data).forEach(function(k){delete data[k]});persist()}};
}

  render();

  db.collection(base+'/semanal').onSnapshot(function(q){var m={};q.docs.forEach(function(d){m[d.id]=d.data()});S.semanais=m;render()});

}
function semanaExemplo(){
  var base='registros/'+S.uid, w0=domingoDe(hoje()), w1=somaDias(w0,-7), w2=somaDias(w0,-14), hj=hoje(), n=0;
  function add(dia,km,tipo,esf,faixas,extra){
    if(dia>hj)return;
    var t={data:dia,criadoEm:new Date(isoToDate(dia).getTime()+43200000+(n++)).toISOString()};
    if(km==null){t.descanso=true;t.desconforto=false}
    else{
      t.descanso=false;t.distanciaKm=km;t.tempoMin=Math.round(km*5.7);t.tipo=tipo;t.esforco=esf;t.desconforto=!!faixas;
      if(faixas){var mx=Math.max.apply(null,Object.keys(faixas).map(function(k){return faixas[k]}));t.quando='durante';t.mudouTreino=mx===3?'reduzi':'nao';t.pernas={dir:Object.assign({faixas:faixas,dor:[0,2,5,7][mx],caminhar:'nao',inicio:null},extra||{})}}
    }
    S.db.collection(base+'/treinos').add(t);
  }
  // duas semanas atrás: sem desconforto (base de comparação)
  add(somaDias(w2,1),5.0,'rodagem',4);add(somaDias(w2,3),6.0,'rodagem',5);add(somaDias(w2,5),5.0,'intervalado',7);add(somaDias(w2,6),10.0,'longo',6);
  S.db.doc(base+'/semanal/'+w2).set({semana:w2,inicio:w2,fim:somaDias(w2,6),respostas:[0,1,0,1],pontos:[0,6,0,8],gravidade:14,instrumento:'OSTRC-BR',criadoEm:isoToDate(somaDias(w2,6)).toISOString()});
  // semana passada: desconforto na tíbia direita que piora
  add(w1,null);add(somaDias(w1,1),6.0,'rodagem',4);add(somaDias(w1,2),null);
  add(somaDias(w1,3),5.2,'rodagem',5,{4:1},{inicio:'gradual'});add(somaDias(w1,4),7.0,'intervalado',7,{4:2,3:1});
  add(somaDias(w1,5),null);add(somaDias(w1,6),8.0,'longo',6,{5:1,4:3,3:2});
  // esta semana, até hoje
  add(w0,5.0,'rodagem',3,{4:1});
  S.db.collection(base+'/mensagens').add({texto:'Vi que o desconforto na sua tíbia direita aumentou na semana passada. Vamos avaliar na próxima sessão. Até lá, faça só rodagens leves. (Mensagem de exemplo)',criadoEm:new Date().toISOString()});
}
async function salvar(path,dados,depois){
  if(!S.db||!S.uid){S.error='Sem conexão com o armazenamento. Abra o app pelo link do claude.ai, com sua conta.';render();return}
  S.saving=true;S.error='';render();
  try{
    dados.criadoEm=new Date().toISOString();
    if(path.split('/').length%2===1) await S.db.collection(path).add(dados);
    else await S.db.doc(path).set(dados);
    S.saving=false; depois&&depois(); render();
  }catch(e){
    S.saving=false;
    if(e&&e.code==='invalid_argument'){S.readOnly=true;S.error='Sua conta não tem permissão para salvar aqui. Peça à equipe do projeto acesso de Contribuidor.'}
    else if(e&&e.code==='quota_exceeded'){S.error='O armazenamento do piloto está cheio. Avise a equipe do projeto.'}
    else{S.error='Não foi possível salvar agora. Confira sua conexão e tente de novo.'}
    render();
  }
}

function descreveRegistro(r){
  if(r.descanso)return 'Você já registrou esse dia como descanso.';
  var tipo=(TIPOS.filter(function(x){return x[0]===r.tipo})[0]||[null,'treino'])[1].toLowerCase();
  var tm=r.tempoMin?', '+String(r.tempoMin).replace('.',',')+' min':'';
  return 'Você já registrou um treino nesse dia: '+tipo+tm+'.';
}

function periodo(a,b){return a.getMonth()===b.getMonth()?a.getDate()+' a '+b.getDate()+' de '+MESES[b.getMonth()]:a.getDate()+' de '+MESES[a.getMonth()]+' a '+b.getDate()+' de '+MESES[b.getMonth()]}
function telaSemana(){
  var semIni=S.semIni||domingoDe(hoje()), atual=domingoDe(hoje()), dias=[];
  for(var k=0;k<7;k++)dias.push(isoToDate(somaDias(semIni,k)));
  var ini=semIni, fim=somaDias(semIni,6), hj=hoje();
  var regs=S.treinos.filter(function(t){return t.data>=ini&&t.data<=fim});
  var totalKm=0, treinos=0, comDor=0, agg={dir:{},esq:{}}, piorDor={dir:null,esq:null};
  var cel=dias.map(function(d){
    var iso=isoLocal(d), rs=regs.filter(function(t){return t.data===iso});
    var km=0, lv=-1, desc=false;
    rs.forEach(function(t){
      if(t.descanso){desc=true;return}
      treinos++; if(t.desconforto)comDor++;
      km+=num(t.distanciaKm)||0;
      var m=0; ['dir','esq'].forEach(function(p){if(t.pernas&&t.pernas[p]){var f=t.pernas[p].faixas||{};Object.keys(f).forEach(function(n){agg[p][n]=Math.max(agg[p][n]||0,f[n]);m=Math.max(m,f[n])});if(t.pernas[p].dor!=null)piorDor[p]=Math.max(piorDor[p]==null?0:piorDor[p],t.pernas[p].dor)}});
      lv=Math.max(lv,m);
    });
    totalKm+=km;
    var fut=iso>hj;
    var cls=lv>=0?'l'+lv:(desc?'rest':(fut?'fut':''));
    var lab=lv>=0?NIVEL[lv]:(desc?'descanso':(fut?'ainda não chegou':'sem registro'));
    return '<div class="day"><span>'+DIAS[d.getDay()]+'<br><b style="color:var(--ink);font-size:13px">'+d.getDate()+'</b></span><span class="p '+cls+'" role="img" aria-label="'+DIAS[d.getDay()]+': '+lab+'"></span><span class="km">'+(km?fmtKm(km):'–')+'</span></div>'
  }).join('');
  var pernasDor=['esq','dir'].filter(function(p){return Object.keys(agg[p]).length});
  var mapa=pernasDor.length?
    '<div class="card"><h2 style="font-size:17px">Onde doeu nesta semana</h2><div class="minis">'+pernasDor.map(function(p){return '<div style="display:flex;align-items:center;gap:10px">'+miniLeg(agg[p])+'<div><p style="font-weight:700">'+NOME_PERNA[p]+'</p><p class="lead" style="font-size:13px">'+resumoFaixas(agg[p])+'</p>'+(piorDor[p]!=null?'<p class="lead" style="font-size:13px">Pior dor da semana: '+piorDor[p]+' de 10</p>':'')+'</div></div>'}).join('')+'</div>'+
    '<p class="lead" style="font-size:13px">Desconforto em '+comDor+' de '+treinos+' treino'+(treinos===1?'':'s')+'.</p></div>':
    (treinos?'<div class="card"><h2 style="font-size:17px">Nenhum desconforto nesta semana</h2><p class="lead">'+treinos+' treino'+(treinos===1?'':'s')+' registrado'+(treinos===1?'':'s')+'.</p></div>':
    '<div class="card"><h2 style="font-size:17px">Nenhum treino registrado nesta semana</h2><p class="lead">Registre o próximo treino logo depois de terminar.</p><button class="btn" data-act="novo">Registrar treino</button></div>');
  var msg=S.msg?'<div class="card"><p class="eyebrow">Mensagem da clínica</p><p id="msgtxt"></p><p class="lead" style="font-size:12px" id="msgdata"></p></div>':'';
  return '<section class="screen" style="display:flex;flex-direction:column;gap:16px">'+
  '<div class="head"><p class="eyebrow">Minha semana · domingo a sábado</p><div class="linkrow"><h1>'+(semIni===atual?'Esta semana':(semIni===somaDias(atual,-7)?'Semana passada':'Semana'))+'</h1><span style="font-weight:700;color:var(--muted)">'+fmtKm(totalKm)+' km</span></div>'+
  '<div class="linkrow"><button class="btn ghost" data-act="semNav" data-v="-1" style="min-height:44px;width:auto;font-size:14px;padding:0 14px" aria-label="Semana anterior">‹ Anterior</button><p style="font-weight:700">'+periodo(dias[0],dias[6])+'</p><button class="btn ghost" data-act="semNav" data-v="1" style="min-height:44px;width:auto;font-size:14px;padding:0 14px" aria-label="Próxima semana"'+(semIni>=atual?' disabled':'')+'>Próxima ›</button></div></div>'+
  '<div class="card"><div class="days">'+cel+'</div><div class="legend"><span><i style="background:var(--surface);border:1px solid var(--faint)"></i>sem desconforto</span><span><i style="background:var(--p1)"></i>leve</span><span><i style="background:var(--p2)"></i>moderado</span><span><i style="background:var(--p3)"></i>forte</span><span><i style="background:var(--chip)"></i>descanso</span></div></div>'+
  mapa+msg+'<button class="btn ghost" data-act="relSemana" data-v="'+semIni+'">Ver relatório desta semana</button></section>'
}

// ---------- relatório semanal ----------
function isoToDate(iso){var p=iso.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDias(iso,n){var x=isoToDate(iso);x.setDate(x.getDate()+n);return isoLocal(x)}
function janela(fim,n){var a=[];for(var k=n-1;k>=0;k--)a.push(addDias(fim,-k));return a}
function cargaDe(t){return (num(t.tempoMin)||0)*(t.esforco||0)}
function nivelRegistro(t){var m=0;['dir','esq'].forEach(function(p){if(t.pernas&&t.pernas[p]){var f=t.pernas[p].faixas||{};Object.keys(f).forEach(function(n){m=Math.max(m,f[n])})}});return m}
function semRelatorio(){return S.relSem||semanaRespondidaRecente()||domingoDe(hoje())}
function fmtMin(m){m=Math.round(m||0);var h=Math.floor(m/60),r=m%60;return h?h+' h '+pad(r)+' min':r+' min'}
function diaCurto(iso){var d=isoToDate(iso);return DIAS[d.getDay()]+' '+d.getDate()}
function ostrcSubstancial(o){if(!o||!o.respostas)return false;var r=o.respostas;return r[0]===3||r[1]>=2||r[2]>=2}
var TIPO_NOME={rodagem:'Rodagem',intervalado:'Intervalado',longo:'Longo',prova:'Prova'};

function relDados(ini){
  var fim=somaDias(ini,6), dias=janela(fim,7), hj=hoje();
  var noIntervalo=function(a,b){return S.treinos.filter(function(t){return t.data>=a&&t.data<=b})};
  var regs=noIntervalo(ini,fim).slice().sort(function(a,b){return a.data<b.data?-1:a.data>b.data?1:0});
  var treinos=regs.filter(function(t){return !t.descanso});
  var R={fim:fim,ini:ini,dias:dias,regs:regs,treinos:treinos};
  R.descansos=regs.length-treinos.length;
  R.diasReg=dias.filter(function(d){return regs.some(function(t){return t.data===d})}).length;
  R.diasPossiveis=dias.filter(function(d){return d<=hj}).length;
  R.km=treinos.reduce(function(s,t){return s+(num(t.distanciaKm)||0)},0);
  R.tempo=treinos.reduce(function(s,t){return s+(num(t.tempoMin)||0)},0);
  R.carga=treinos.reduce(function(s,t){return s+cargaDe(t)},0);
  var prev=noIntervalo(addDias(ini,-7),addDias(ini,-1)).filter(function(t){return !t.descanso});
  R.prevTem=prev.length>0; R.prevCarga=prev.reduce(function(s,t){return s+cargaDe(t)},0);
  R.varCarga=R.prevTem&&R.prevCarga>0?Math.round((R.carga-R.prevCarga)/R.prevCarga*100):null;
  R.maiorSessao=treinos.reduce(function(m,t){return Math.max(m,num(t.tempoMin)||0)},0);
  var ant=noIntervalo(addDias(ini,-28),addDias(ini,-1)).filter(function(t){return !t.descanso});
  R.maior28=ant.length?ant.reduce(function(m,t){return Math.max(m,num(t.tempoMin)||0)},0):null;
  R.porDia=dias.map(function(d){
    var rs=regs.filter(function(t){return t.data===d});
    var o={iso:d,futuro:d>hj,registrado:rs.length>0,descanso:rs.some(function(t){return t.descanso}),km:0,tempo:0,carga:0,nivel:-1};
    rs.forEach(function(t){if(t.descanso)return;o.km+=num(t.distanciaKm)||0;o.tempo+=num(t.tempoMin)||0;o.carga+=cargaDe(t);o.nivel=Math.max(o.nivel,nivelRegistro(t))});
    return o;
  });
  R.pernas={};
  ['esq','dir'].forEach(function(p){
    var agg={},cont={},pior=null,diasDor=0;
    treinos.forEach(function(t){if(t.pernas&&t.pernas[p]){var f=t.pernas[p].faixas||{};if(Object.keys(f).length)diasDor++;Object.keys(f).forEach(function(n){agg[n]=Math.max(agg[n]||0,f[n]);cont[n]=(cont[n]||0)+1});if(t.pernas[p].dor!=null)pior=Math.max(pior==null?0:pior,t.pernas[p].dor)}});
    if(diasDor)R.pernas[p]={agg:agg,cont:cont,pior:pior,dias:diasDor};
  });
  R.comDor=treinos.filter(function(t){return t.desconforto}).length;
  R.modificados=treinos.filter(function(t){return t.mudouTreino==='reduzi'||t.mudouTreino==='parei'}).length;
  R.semId=ini;
  R.ost=S.semanais[ini]||null;
  R.ostPrev=S.semanais[addDias(ini,-7)]||null;
  R.substancial=ostrcSubstancial(R.ost);
  // pontos para conversar com a fisioterapia (descritivos, sem interpretação clínica)
  var P=[];
  treinos.forEach(function(t){['dir','esq'].forEach(function(p){var x=t.pernas&&t.pernas[p];if(!x)return;var lado=p==='dir'?'direita':'esquerda';
    if(x.caminhar==='sim'||x.caminhar==='pouco')P.push('Dor ao caminhar ('+(x.caminhar==='sim'?'sim':'um pouco')+') na perna '+lado+', '+diaCurto(t.data)+'.');
    if(x.inicio==='subito')P.push('Desconforto que começou de repente na perna '+lado+', '+diaCurto(t.data)+'.');
    var ks=Object.keys(x.faixas||{});if(ks.length===1&&x.faixas[ks[0]]===3)P.push('Dor forte concentrada em uma única faixa (faixa '+ks[0]+', perna '+lado+'), '+diaCurto(t.data)+'.');
  })});
  var comNivel=R.porDia.filter(function(d){return d.nivel>0});
  if(comNivel.length>=2&&comNivel[comNivel.length-1].nivel>comNivel[0].nivel)P.push('O desconforto aumentou ao longo da semana ('+NIVEL[comNivel[0].nivel]+' em '+diaCurto(comNivel[0].iso)+', '+NIVEL[comNivel[comNivel.length-1].nivel]+' em '+diaCurto(comNivel[comNivel.length-1].iso)+').');
  if(R.varCarga!=null&&R.varCarga>0&&R.comDor>0)P.push('A carga subiu '+R.varCarga+'% em relação à semana anterior, numa semana com desconforto.');
  if(R.maior28!=null&&R.maiorSessao>R.maior28)P.push('A sessão mais longa da semana ('+fmtMin(R.maiorSessao)+') superou a mais longa das quatro semanas anteriores ('+fmtMin(R.maior28)+').');
  if(R.modificados)P.push(R.modificados+' treino'+(R.modificados>1?'s':'')+' reduzido'+(R.modificados>1?'s':'')+' ou interrompido'+(R.modificados>1?'s':'')+' por desconforto.');
  if(R.substancial)P.push('A semana se enquadra como problema substancial pelo critério do OSTRC-BR.');
  R.pontos=P;
  R.obs=(S.obs[R.semId]&&S.obs[R.semId].texto)||'';
  return R;
}

function graficoSemana(R){
  var max=Math.max.apply(null,R.porDia.map(function(d){return d.carga}).concat([1]));
  var cores=['#FFFFFF','#F7D9C8','#EDA27C','#B5532D'];
  var h='<svg viewBox="0 0 350 168" style="width:100%;max-height:190px;display:block;margin:0 auto" role="img" aria-label="Carga e desconforto por dia">';
  h+='<line x1="4" y1="100" x2="346" y2="100" stroke="#D9D6CC" stroke-width="1"></line>';
  R.porDia.forEach(function(d,i){
    var x=i*50+10, bh=Math.round(d.carga/max*84), y=100-bh;
    if(d.carga>0)h+='<rect x="'+x+'" y="'+y+'" width="30" height="'+bh+'" rx="4" fill="#8FA088"></rect><text x="'+(x+15)+'" y="'+(y-4)+'" text-anchor="middle" font-size="9" font-weight="700" fill="#3F4B3C" font-family="Manrope, sans-serif">'+Math.round(d.carga)+'</text>';
    var cy=120;
    if(d.nivel>=0)h+='<circle cx="'+(x+15)+'" cy="'+cy+'" r="8" fill="'+cores[d.nivel]+'" stroke="'+(d.nivel===0?'#8A9486':'none')+'" stroke-width="1.5"></circle>';
    else if(d.descanso)h+='<circle cx="'+(x+15)+'" cy="'+cy+'" r="8" fill="#EDE9DF"></circle>';
    else if(d.futuro)h+='<circle cx="'+(x+15)+'" cy="'+cy+'" r="8" fill="none" stroke="#E4E1D8" stroke-dasharray="1 3"></circle>';
    else h+='<circle cx="'+(x+15)+'" cy="'+cy+'" r="8" fill="none" stroke="#CBCAC0" stroke-dasharray="3 3"></circle>';
    var dd=isoToDate(d.iso);
    h+='<text x="'+(x+15)+'" y="146" text-anchor="middle" font-size="10" font-weight="700" fill="#566352" font-family="Manrope, sans-serif">'+DIAS[dd.getDay()]+'</text><text x="'+(x+15)+'" y="160" text-anchor="middle" font-size="11" font-weight="800" fill="#233122" font-family="Manrope, sans-serif">'+dd.getDate()+'</text>';
  });
  return h+'</svg>';
}
function pernaRel(f){
  var h='<div style="position:relative;width:64px;height:166px;background:#F5F3EC;border-radius:10px;flex-shrink:0"><svg viewBox="15 248 175 455" style="position:absolute;inset:0;width:100%;height:100%" aria-hidden="true">'+LEG.replace(/stroke-width="2.2"/,'stroke-width="4"');
  for(var i=0;i<9;i++){var n=9-i,l=f[n]||0,y=Y0+i*STEP;h+='<rect x="59" y="'+y+'" width="56" height="'+H+'" rx="11.5" fill="'+['rgba(255,255,255,.6)','#F7D9C8','#EDA27C','#B5532D'][l]+'"></rect>'}
  return h+'</svg></div>';
}
function tabela(cab,linhas){

function relHtml(R,versao,pdf){
  var completa=versao==='completa';
  var a=isoToDate(R.ini), b=isoToDate(R.fim), g=new Date();
  var h='';
  h+='<div class="blk relhead"><p class="eyebrow">Relatório da semana · '+(completa?'versão completa':'versão do atleta')+'</p><h1>'+periodo(a,b)+'</h1>'+
     '<p class="lead">Atleta: '+esc(S.nome||'—')+' · Gerado em '+g.getDate()+' de '+MESES[g.getMonth()]+' de '+g.getFullYear()+'</p>'+
     '<p class="lead">Semana de domingo a sábado. Registros em '+R.diasReg+' de '+R.diasPossiveis+' dia'+(R.diasPossiveis===1?'':'s')+(R.diasPossiveis<7?' até hoje':'')+(R.diasReg<5&&R.diasPossiveis===7?'. Com poucos dias registrados, o resumo pode não representar a semana.':'.')+'</p></div>';
  if(!pdf)h+='<div class="seg" role="group" aria-label="Versão do relatório"><button type="button" data-act="relVersao" data-v="atleta" aria-pressed="'+pressed(!completa)+'">Versão do atleta</button><button type="button" data-act="relVersao" data-v="completa" aria-pressed="'+pressed(completa)+'">Versão completa</button></div>';
  var tile=function(v,l){return '<div class="tile"><b>'+v+'</b><span>'+l+'</span></div>'};
  h+='<div class="blk card"><div class="tiles">'+tile(R.treinos.length,'treino'+(R.treinos.length===1?'':'s'))+tile(fmtKm(R.km)+' km','distância')+tile(fmtMin(R.tempo),'tempo total')+tile(R.comDor+' de '+R.treinos.length,'treinos com desconforto')+'</div></div>';
  h+='<div class="blk card"><h2 style="font-size:17px">Dia a dia</h2>'+graficoSemana(R)+'<p class="lead" style="font-size:12px">Barras: carga do treino (tempo × esforço). Círculos: maior desconforto marcado no dia (branco sem desconforto, pêssego leve, damasco moderado, terracota forte; cinza descanso; tracejado sem registro; pontilhado dias que ainda não chegaram).</p></div>';
  var ps=Object.keys(R.pernas);
  h+='<div class="blk card"><h2 style="font-size:17px">Onde doeu</h2>'+(ps.length?ps.map(function(p){var x=R.pernas[p];return '<div style="display:flex;gap:14px;align-items:center">'+pernaRel(x.agg)+'<div><p style="font-weight:700">'+NOME_PERNA[p]+'</p><p class="lead" style="font-size:13px">'+resumoFaixas(x.agg)+'</p><p class="lead" style="font-size:13px">Desconforto em '+x.dias+' treino'+(x.dias>1?'s':'')+(x.pior!=null?' · pior nota: '+x.pior+' de 10':'')+'</p></div></div>'}).join(''):'<p class="lead">Nenhum desconforto registrado nesta semana.</p>')+'</div>';
  var ost=R.ost;
  h+='<div class="blk card"><h2 style="font-size:17px">Avaliação semanal (OSTRC-BR)</h2>'+(ost?
     '<p><span style="font-family:Nunito,Manrope,sans-serif;font-weight:800;font-size:30px;color:var(--p3)">'+ost.gravidade+'</span> <span class="lead">de 100 no escore de gravidade</span></p>'+
     '<p class="lead" style="font-size:13px">'+(R.ostPrev?'Semana anterior ('+rotuloSemana(addDias(R.ini,-7))+'): '+R.ostPrev.gravidade+' de 100.':'Sem avaliação na semana anterior para comparar.')+'</p>'+
     (completa?'<p class="lead" style="font-size:13px">Respostas: '+ost.respostas.map(function(r,i){return 'P'+(i+1)+' opção '+(r+1)+' ('+ost.pontos[i]+' pts)'}).join(' · ')+'</p><p style="font-size:13px;font-weight:700">'+(R.substancial?'Problema substancial: sim (redução moderada ou grave de volume ou desempenho, ou sem conseguir treinar).':'Problema substancial: não.')+'</p>':'')
     :'<p class="lead">O questionário desta semana ainda não foi respondido.</p>')+'</div>';
  if(completa){
    h+='<div class="blk card"><h2 style="font-size:17px">Carga</h2>'+tabela(['Indicador','Valor'],[
      ['Carga da semana (tempo × esforço)',Math.round(R.carga)],
      ['Carga da semana anterior',R.prevTem?Math.round(R.prevCarga):'sem registros'],
      ['Variação',R.varCarga!=null?(R.varCarga>0?'+':'')+R.varCarga+'%':'—'],
      ['Sessão mais longa da semana',R.maiorSessao?fmtMin(R.maiorSessao):'—'],
      ['Mais longa nas 4 semanas anteriores',R.maior28!=null?fmtMin(R.maior28):'sem registros'],
      ['Treinos reduzidos ou interrompidos',R.modificados],
      ['Dias de descanso',R.descansos]])+'</div>';
    var lf=[];ps.forEach(function(p){var x=R.pernas[p];Object.keys(x.cont).map(Number).sort(function(a,b){return b-a}).forEach(function(n){lf.push([p==='dir'?'Direita':'Esquerda',n,x.cont[n],NIVEL[x.agg[n]]])})});
    if(lf.length)h+='<div class="blk card"><h2 style="font-size:17px">Faixas marcadas</h2>'+tabela(['Perna','Faixa','Vezes','Nível máximo'],lf)+'<p class="lead" style="font-size:12px">Faixas numeradas do tornozelo (1) ao joelho (9), na borda interna da tíbia.</p></div>';
    var lt=R.regs.map(function(t){
      if(t.descanso)return [diaCurto(t.data),'Descanso','—','—','—','—','—'];
      var dor=['dir','esq'].filter(function(p){return t.pernas&&t.pernas[p]}).map(function(p){var x=t.pernas[p];return (p==='dir'?'D':'E')+': '+resumoFaixas(x.faixas||{})+', nota '+x.dor+(x.caminhar&&x.caminhar!=='nao'?', dói ao caminhar':'')}).join('; ')||'sem desconforto';
      return [diaCurto(t.data),TIPO_NOME[t.tipo]||'—',fmtMin(t.tempoMin),t.distanciaKm!=null?fmtKm(t.distanciaKm)+' km':'—',t.esforco,Math.round(cargaDe(t)),dor];
    });
    h+='<div class="blk card"><h2 style="font-size:17px">Treinos registrados</h2>'+(lt.length?tabela(['Dia','Tipo','Tempo','Distância','Esforço','Carga','Desconforto'],lt):'<p class="lead">Nenhum registro.</p>')+'</div>';
  }
  h+='<div class="blk card"><h2 style="font-size:17px">Pontos para conversar com a fisioterapia</h2>'+(R.pontos.length?'<ul class="pontos">'+R.pontos.map(function(p){return '<li>'+esc(p)+'</li>'}).join('')+'</ul>':'<p class="lead">Nenhum ponto de atenção registrado nesta semana.</p>')+'</div>';
  if(pdf) h+='<div class="blk card"><h2 style="font-size:17px">Observações do atleta</h2><p class="lead">'+(R.obs?esc(R.obs):'Sem observações.')+'</p></div>'+
     '<div class="blk"><p class="lead" style="font-size:11px">Este relatório descreve o que o atleta registrou no app. Não é diagnóstico. Avaliação semanal: OSTRC-BR (Pimenta, Hespanhol e Lopes, 2021). Um projeto do dotLAB · UPE.</p></div>';
  else h+='<div class="blk card"><label for="relObs" class="lbl">Observações para a fisioterapia (opcional)</label><textarea id="relObs" rows="3" placeholder="Ex.: troquei de tênis, treinei mais no asfalto, dormi mal…" style="width:100%;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);padding:10px 12px;font-family:inherit;font-size:15px;resize:vertical">'+esc(R.obs)+'</textarea><p class="note" style="text-align:left">Salvo quando você sai do campo. Entra no PDF.</p></div>';
  return h;
}
function telaRelatorio(){
  var R=relDados(semRelatorio());
  return '<section class="screen" style="display:flex;flex-direction:column;gap:16px">'+relHtml(R,S.rel.versao,false)+
    (S.error?'<p class="err" role="alert">'+esc(S.error)+'</p>':'')+
    (S.relMsg?'<p class="note" role="status">'+esc(S.relMsg)+'</p>':'')+
    '<button class="btn" data-act="exportar"'+(S.exportando?' disabled':'')+'>'+(S.exportando?'Gerando PDF…':'Exportar PDF ('+(S.rel.versao==='completa'?'versão completa':'versão do atleta')+')')+'</button>'+
  '</section>';
}
function carregarScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error('script'))};document.head.appendChild(s)})}
async function salvarArquivo(nome,blob){
  if(window.claude&&window.claude.use){
    var dl=null; try{dl=await window.claude.use('downloads')}catch(e){dl=null}
    if(dl){
      try{await dl.save({filename:nome,data:blob});return 'salvo'}
      catch(e){if(e&&e.code==='declined')return 'recusado'; if(e&&e.code==='rate_limited')return 'ocupado'; if(e&&['unavailable','not_granted','capability_disabled','capability_removed'].indexOf(e.code)<0)throw e}
    }
  }
  var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},5000);return 'salvo';
}
async function exportarPDF(){
  S.exportando=true;S.error='';S.relMsg='';render();
  var root=document.documentElement, temaAnt=root.getAttribute('data-theme'), box=null;
  try{
    if(!window.html2canvas)await carregarScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf)await carregarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    var R=relDados(semRelatorio()), versao=S.rel.versao;
    root.setAttribute('data-theme','light');
    box=document.createElement('div');
    box.className='relpdf';
    box.style.cssText='position:fixed;left:-10000px;top:0;width:760px;background:#FFFFFF;padding:28px 32px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;font-family:Manrope,system-ui,sans-serif;color:#233122';
    box.innerHTML=relHtml(R,versao,true);
    document.body.appendChild(box);
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    var canvas=await window.html2canvas(box,{scale:2,backgroundColor:'#FFFFFF',windowWidth:760,logging:false});
    var W=box.offsetWidth, total=box.offsetHeight, pageH=Math.floor(W*277/190);
    var blocks=[].map.call(box.children,function(b){return {t:b.offsetTop-8,b:b.offsetTop+b.offsetHeight}});
    var cortes=[0],ini=0;
    blocks.forEach(function(k){if(k.b-ini>pageH&&k.t>ini){cortes.push(k.t);ini=k.t}});
    var fin=[];for(var i=0;i<cortes.length;i++){var c=cortes[i],prox=i+1<cortes.length?cortes[i+1]:total;fin.push(c);while(prox-c>pageH){c+=pageH;fin.push(c)}}
    var pdfDoc=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    var k=canvas.width/W;
    fin.forEach(function(y0,i){
      var y1=i+1<fin.length?fin[i+1]:total, hpx=Math.max(1,Math.round((y1-y0)*k));
      var pc=document.createElement('canvas');pc.width=canvas.width;pc.height=hpx;
      var cx=pc.getContext('2d');cx.fillStyle='#FFFFFF';cx.fillRect(0,0,pc.width,pc.height);
      cx.drawImage(canvas,0,Math.round(y0*k),canvas.width,hpx,0,0,canvas.width,hpx);
      if(i>0)pdfDoc.addPage();
      pdfDoc.addImage(pc.toDataURL('image/jpeg',0.92),'JPEG',10,10,190,(y1-y0)*190/W);
      pdfDoc.setFontSize(8);pdfDoc.setTextColor(86,99,82);pdfDoc.text('Página '+(i+1)+' de '+fin.length,200,291,{align:'right'});
    });
    var nome='relatorio-semana-'+R.ini+'-a-'+R.fim+'-'+(versao==='completa'?'completo':'atleta')+'.pdf';
    var st=await salvarArquivo(nome,pdfDoc.output('blob'));
    S.relMsg=st==='salvo'?'PDF gerado: '+nome:(st==='recusado'?'Download cancelado.':'Já existe um download aguardando confirmação.');
  }catch(e){
    S.error='Não foi possível gerar o PDF agora. Confira a conexão e tente de novo.';
  }finally{
    if(box)box.remove();
    if(temaAnt==null)root.removeAttribute('data-theme');else root.setAttribute('data-theme',temaAnt);
    S.exportando=false;render();
  }
}

// ---------- render ----------
function render(){
  var html;
  if(!S.ready) html=telaCarregando();
  else if(!S.offline && !(S.perfil&&S.perfil.consentimento)) html=telaConsentimento();
  else switch(S.screen){
    case 'reg1': html=telaReg1(); break;
    case 'reg2': html=telaReg2(); break;
    case 'reg3': html=telaReg3(); break;
    case 'feito': html=telaFeito(); break;
    case 'semIntro': html=telaSemIntro(); break;
    case 'semQ': html=telaSemQ(); break;
    case 'semana': html=telaSemana(); break;
    case 'relatorio': html=telaRelatorio(); break;
    default: html=telaHoje();
  }
  var foco=document.activeElement&&document.activeElement.id;
  app.innerHTML=html;
  if(S.msg){var mt=document.getElementById('msgtxt'),md=document.getElementById('msgdata');if(mt)mt.textContent=String(S.msg.texto||'');if(md&&S.msg.criadoEm){var dd=new Date(S.msg.criadoEm);md.textContent=isNaN(dd)?'':dd.getDate()+' de '+MESES[dd.getMonth()]}}
  if(foco){var el=document.getElementById(foco);if(el){el.focus();var v=el.value;el.value='';el.value=v}}
  var mostraTabs=S.ready&&(S.offline||(S.perfil&&S.perfil.consentimento))&&(S.screen==='hoje'||S.screen==='semana'||S.screen==='feito'||S.screen==='relatorio');
  tabs.style.display=mostraTabs?'flex':'none';
  tabs.querySelectorAll('.tab').forEach(function(t){if(t.dataset.to===S.screen||(S.screen==='relatorio'&&t.dataset.to==='semana'))t.setAttribute('aria-current','page');else t.removeAttribute('aria-current')});
}
function ir(scr){S.screen=scr;S.error='';render();window.scrollTo(0,0)}

// ---------- eventos ----------
app.addEventListener('change',function(e){
  if(e.target.id==='relObs'){
    var sid=semRelatorio(), txt=e.target.value.slice(0,1000);
    if(((S.obs[sid]&&S.obs[sid].texto)||'')===txt)return;
    S.db&&S.uid&&S.db.doc('registros/'+S.uid+'/obs/'+sid).set({texto:txt,criadoEm:new Date().toISOString()}).catch(function(){S.error='Não foi possível salvar a observação.';render()});
  }
});
app.addEventListener('input',function(e){
  if(!S.draft)return;
  if(e.target.id==='dist')S.draft.distancia=e.target.value;
  if(e.target.id==='tempo')S.draft.tempo=e.target.value;
  if(e.target.id==='dataTreino'){var v=e.target.value;if(v&&v>=diasAtras(6)&&v<=hoje()){S.draft.data=v;render();return}}
  if(S.screen==='reg1'){
    var ok=podeAvancar(S.draft);
    app.querySelectorAll('[data-act=sim],[data-act=naoDor]').forEach(function(b){b.disabled=!ok||S.saving});
    var fl=document.getElementById('falta'); if(fl)fl.textContent=faltaTxt(S.draft);
  }
});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b||b.disabled)return;
  var a=b.dataset.act, v=b.dataset.v, p=b.dataset.p, d=S.draft;
  switch(a){
    case 'go': if(b.dataset.to==='semana'&&b.classList.contains('tab'))S.semIni=null; ir(b.dataset.to); break;
    case 'aceitar':
      salvar('registros/'+S.uid,{consentimento:true,demo:true},function(){S.screen='hoje'});
      break;
    case 'novo': S.draft=novoDraft(); ir('reg1'); break;
    case 'novoOutroDia': S.draft=novoDraft(); S.draft.data=diasAtras(1); ir('reg1'); break;
    case 'exemplo': semanaExemplo(); S.semIni=somaDias(domingoDe(hoje()),-7); ir('semana'); break;
    case 'limpar':
      if(window.confirm('Apagar todos os registros desta demonstração neste aparelho?')){S.db.reset();S.screen='hoje';S.draft=null;S.sem=null;render()}
      break;
    case 'descanso': if(registroNaData(hoje()))return; salvar('registros/'+S.uid+'/treinos',{data:hoje(),descanso:true,desconforto:false}); break;
    case 'tipo': d.tipo=v; render(); break;
    case 'outraData':
      d.outro=true; var livre=null; for(var k=0;k<=6;k++){if(!registroNaData(diasAtras(k))){livre=diasAtras(k);break}}
      if(livre)d.data=livre; render(); var di=document.getElementById('dataTreino'); if(di)di.focus(); break;
    case 'quandoTreino':
      if(v==='hoje'){d.data=hoje();d.outro=false}
      else if(v==='ontem'){d.data=diasAtras(1);d.outro=false}
      else {d.outro=true}
      render(); break;
    case 'esforco': d.esforco=+v; render(); break;
    case 'sim': if(!podeAvancar(d))return; ir('reg2'); break;
    case 'naoDor':
      if(!podeAvancar(d))return;
      salvar('registros/'+S.uid+'/treinos',montarTreino(false),function(){S.draft=null;S.screen='feito'}); break;
    case 'perna': d.perna=v; render(); break;
    case 'pincel': d.pincel=+v; render(); break;
    case 'faixa':
      var f=d.faixas[d.perna], n=+v;
      if(d.pincel===0||f[n]===d.pincel) delete f[n]; else f[n]=d.pincel;
      render();
      var nb=app.querySelector('.band[data-v="'+n+'"]'); if(nb)nb.focus();
      break;
    case 'voltar1': ir('reg1'); break;
    case 'cont2': ir('reg3'); break;
    case 'voltar2': ir('reg2'); break;
    case 'quando': d.quando=v; render(); break;
    case 'mudou': d.mudou=v; render(); break;
    case 'dor': d.dor[p]=+v; render(); break;
    case 'caminhar': d.caminhar[p]=v; render(); break;
    case 'inicio': d.inicio[p]=v; render(); break;
    case 'enviar':
      if(registroNaData(d.data))return;
      salvar('registros/'+S.uid+'/treinos',montarTreino(true),function(){S.draft=null;S.screen='feito'}); break;
    case 'semIntro': S.semAlvo=v||semanaAvaliavel()||domingoDe(hoje()); ir('semIntro'); break;
    case 'relSemana': S.relSem=v; S.rel.versao=S.rel.versao||'atleta'; S.relMsg=''; ir('relatorio'); break;
    case 'semNav': S.semIni=somaDias(S.semIni||domingoDe(hoje()),+v*7); render(); break;
    case 'relVersao': S.rel.versao=v; S.relMsg=''; render(); break;
    case 'exportar': exportarPDF(); break;
    case 'semComecar': S.sem={i:0,r:[null,null,null,null]}; ir('semQ'); break;
    case 'semOpt': S.sem.r[S.sem.i]=+v; render(); break;
    case 'semVoltar': if(S.sem.i===0)ir('semIntro'); else {S.sem.i--; render()} break;
    case 'semProx':
      if(S.sem.i<OSTRC.length-1){S.sem.i++; render(); window.scrollTo(0,0); break}
      var pts=S.sem.r.map(function(k,i){return OSTRC[i].pts[k]});
      var sem=S.semAlvo||domingoDe(hoje());
      salvar('registros/'+S.uid+'/semanal/'+sem,{semana:sem,inicio:sem,fim:somaDias(sem,6),respostas:S.sem.r.slice(),pontos:pts,gravidade:pts.reduce(function(a,b){return a+b},0),instrumento:'OSTRC-BR'},function(){S.sem=null;S.relSem=sem;S.screen='relatorio';S.relMsg=''});
      break;
  }
});
function montarTreino(comDor){
  var d=S.draft, t={data:d.data,descanso:false,distanciaKm:num(d.distancia),tempoMin:num(d.tempo),tipo:d.tipo,esforco:d.esforco,desconforto:comDor};
  if(comDor){
    t.quando=d.quando; t.mudouTreino=d.mudou; t.pernas={};
    pernasMarcadas(d).forEach(function(p){
      t.pernas[p]={faixas:Object.assign({},d.faixas[p]),dor:d.dor[p],caminhar:d.caminhar[p],inicio:semDorRecente(p)?d.inicio[p]:null};
    });
  }
  return t;
}

init();
})();
