<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acompanhamento da tíbia · demonstração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EC; --surface:#FFFFFF; --ink:#233122; --ink2:#3F4B3C; --muted:#566352; --faint:#8A9486;
  --line:#E4E1D8; --line2:#D9D6CC; --gold:#B8893A; --gold-ink:#8A6224; --chip:#EDE9DF;
  --primary:#233122; --on-primary:#FFFFFF; --legbg:#F5F3EC;
  --p1:#F7D9C8; --p2:#EDA27C; --p3:#B5532D; --t1:#5A2410; --t2:#4A1E0C; --t3:#FFFFFF;
  --err:#9B2C1E;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151C14; --surface:#1F281E; --ink:#ECEFE8; --ink2:#D3D9CF; --muted:#AAB3A6; --faint:#879183;
    --line:#2F3A2D; --line2:#3D4A3A; --gold:#D4A65A; --gold-ink:#D9B26C; --chip:#2A3428;
    --primary:#ECEFE8; --on-primary:#151C14; --legbg:#E9EDE4; --err:#F09A8A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151C14; --surface:#1F281E; --ink:#ECEFE8; --ink2:#D3D9CF; --muted:#AAB3A6; --faint:#879183;
  --line:#2F3A2D; --line2:#3D4A3A; --gold:#D4A65A; --gold-ink:#D9B26C; --chip:#2A3428;
  --primary:#ECEFE8; --on-primary:#151C14; --legbg:#E9EDE4; --err:#F09A8A;
  color-scheme: dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2{font-family:'Nunito','Manrope',system-ui,sans-serif;font-weight:800;margin:0;color:var(--ink)}
h1{font-size:26px;line-height:1.15}
h2{font-size:19px;line-height:1.25}
p{margin:0}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:24px 20px 112px;display:flex;flex-direction:column;gap:16px;min-height:100%}
.head{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:13px;font-weight:700;color:var(--gold-ink)}
.lead{font-size:14px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.hero{background:var(--primary);color:var(--on-primary);border:none}
.hero h2{color:var(--on-primary);font-size:21px}
.hero p{color:var(--on-primary);opacity:.82;font-size:14px}
.btn{min-height:52px;border-radius:14px;border:none;background:var(--primary);color:var(--on-primary);font-size:16px;font-weight:700;width:100%;display:flex;align-items:center;justify-content:center;padding:0 16px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line2)}
.hero .btn{background:var(--on-primary);color:var(--primary)}
.hero .btn.ghost{background:transparent;color:var(--on-primary);border:1px solid rgba(255,255,255,.35)}
:root[data-theme="dark"] .hero .btn.ghost{border-color:rgba(0,0,0,.3)}
.row{display:flex;gap:10px}
.seg.tipos{display:grid;grid-template-columns:1fr 1fr}
.row>.btn{flex:1}
.lbl{font-size:14px;font-weight:700;margin-bottom:8px;display:block}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:0;min-height:44px;padding:6px 8px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font-size:14px;font-weight:600;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.scale{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:3px}
.scale button{height:44px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);font-size:13px;font-weight:700;padding:0}
.scale button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.scale.pain button[aria-pressed="true"]{background:var(--p3);border-color:var(--p3);color:#fff}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.field{display:flex;flex-direction:column;gap:6px;flex:1}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input{height:48px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);padding:0 12px;font-family:inherit;font-size:18px;font-weight:700;width:100%}
.chip{font-size:12px;font-weight:700;color:var(--muted);background:var(--chip);border-radius:999px;padding:4px 10px;white-space:nowrap}
.chip.on{background:var(--gold-ink);color:#fff}
.weekly{border:2px solid var(--gold);text-align:left;width:100%;font-size:inherit}
.weekly.done{border:1px solid var(--line)}
.linkrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.foot{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-top:8px}
.foot .credit{font-size:11px;font-weight:600;color:var(--faint)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
.tabs .in{display:flex;max-width:480px;width:100%}
.tab{flex:1;min-height:48px;border:none;background:transparent;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tab[aria-current="page"]{color:var(--ink)}
.bar{display:flex;gap:6px}
.bar span{flex:1;height:6px;border-radius:3px;background:var(--line2)}
.bar span.on{background:var(--gold)}
.pin{display:flex;gap:6px}
.pin button{flex:1;min-width:0;min-height:44px;padding:0 4px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.pin button[aria-pressed="true"]{border:2px solid var(--ink)}
.pin .sw{width:16px;height:12px;border-radius:6px;display:inline-block;flex-shrink:0}
.pin button{font-size:12.5px}
.legcard{background:var(--legbg);border-radius:16px;padding:12px 0;display:flex;justify-content:center;position:relative;overflow:hidden}
.legcard .tag{position:absolute;left:14px;font-size:12px;font-weight:700;color:#566352}
.legbox{position:relative;width:200px;height:520px}
.legbox svg{position:absolute;inset:0;width:100%;height:100%}
.band{position:absolute;left:-75px;width:350px;height:6.044%;border:none;background:transparent;padding:0}
.band .pill{position:absolute;left:125.3px;width:64px;top:8%;height:84%;border-radius:999px;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#566352}
.band[data-l="1"] .pill{background:var(--p1);color:var(--t1);font-weight:800}
.band[data-l="2"] .pill{background:var(--p2);color:var(--t2);font-weight:800}
.band[data-l="3"] .pill{background:var(--p3);color:var(--t3);font-weight:800}
.band:focus-visible{outline:none}
.band:focus-visible .pill{outline:3px solid var(--gold);outline-offset:1px}
.legtab{display:flex;flex-direction:column;align-items:center;gap:2px}
.legtab small{font-size:12px;font-weight:600;opacity:.8}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);font-size:15px;font-weight:600;text-align:left;width:100%}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--faint);flex-shrink:0}
.opt[aria-pressed="true"]{border:2px solid var(--ink)}
.opt[aria-pressed="true"] .dot{border:6px solid var(--ink)}
.days{display:flex;gap:4px}
.day{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted);text-align:center;line-height:1.25}
.day .p{width:28px;height:28px;border-radius:50%;border:1.5px dashed var(--line2)}
.day .p.l0{border:1.5px solid var(--faint);background:var(--surface)}
.day .p.l1{border:none;background:var(--p1)}
.day .p.l2{border:none;background:var(--p2)}
.day .p.l3{border:none;background:var(--p3)}
.day .p.rest{border:none;background:var(--chip)}
.day .km{color:var(--ink);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:5px;display:inline-block}
.minis{display:flex;flex-direction:column;gap:12px}
.mini{position:relative;width:46px;height:120px;background:var(--legbg);border-radius:10px;flex-shrink:0}
.mini svg{position:absolute;inset:0;width:100%;height:100%}
.note{font-size:12px;color:var(--muted);text-align:center}
.banner{background:var(--chip);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink2)}
.err{color:var(--err);font-size:13px;font-weight:600}
.done-mark{width:64px;height:64px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;align-self:center;margin-top:24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: no-preference){
  .screen{animation:in .18s ease-out}
  @keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
}
</style>
</head>

<script>
(function(){
'use strict';
// ---------- constantes ----------
var Y0=332, STEP=27.5, H=23, VB_Y=248, VB_H=455;
var NIVEL=['sem desconforto','leve','moderado','forte'];
var TIPOS=[['rodagem','Rodagem'],['intervalado','Intervalado'],['longo','Longo'],['prova','Prova']];
var QUANDO=[['antes','Antes'],['durante','Durante'],['depois','Depois'],['todo','O tempo todo']];
var MUDOU=[['nao','Não'],['reduzi','Diminuí ritmo ou distância'],['parei','Parei']];
var CAMINHAR=[['nao','Não'],['pouco','Um pouco'],['sim','Sim']];
var INICIO=[['gradual','Aos poucos'],['subito','De repente']];
// OSTRC-BR: texto oficial entra após autorização dos autores. Pontuação conforme Pimenta, Hespanhol e Lopes (2021).
var OSTRC=[
  {q:'[Pergunta 1 do OSTRC-BR: participação em treinos e competições]', pts:[0,8,17,25]},
  {q:'[Pergunta 2 do OSTRC-BR: redução do volume de treino]', pts:[0,6,13,19,25]},
  {q:'[Pergunta 3 do OSTRC-BR: efeito no desempenho]', pts:[0,6,13,19,25]},
  {q:'[Pergunta 4 do OSTRC-BR: intensidade dos sintomas]', pts:[0,8,17,25]}
];

// ---------- estado ----------
var S={
  db:null, user:null, uid:null, ready:false, offline:false, readOnly:false,
  perfil:null, treinos:[], semanais:{}, msg:null,
  screen:'hoje', draft:null, sem:null, saving:false, error:''
};
var app=document.getElementById('app');
var tabs=document.getElementById('tabs');
var LEG=document.getElementById('legsvg').content.querySelector('svg').innerHTML;

// ---------- utilidades ----------
function pad(n){return String(n).padStart(2,'0')}
function isoLocal(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function hoje(){return isoLocal(new Date())}
function isoWeek(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);var y=t.getUTCFullYear();var w=Math.ceil(((t-Date.UTC(y,0,1))/86400000+1)/7);return y+'-W'+pad(w)}
var DIAS=['dom','seg','ter','qua','qui','sex','sáb'];
var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var DIAS_LONGO=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
function dataLonga(d){return DIAS_LONGO[d.getDay()]+', '+d.getDate()+' de '+MESES[d.getMonth()]}
function nivelDor(n){if(n==null)return 0; if(n<=0)return 0; if(n<=3)return 1; if(n<=6)return 2; return 3}
function num(v){var x=parseFloat(String(v||'').replace(',','.'));return isFinite(x)?x:null}
function fmtKm(x){return (Math.round(x*10)/10).toString().replace('.',',')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pressed(b){return b?'true':'false'}
function segHtml(opts,val,act,extra){return '<div class="seg" role="group">'+opts.map(function(o){return '<button type="button" data-act="'+act+'" data-v="'+o[0]+'"'+(extra||'')+' aria-pressed="'+pressed(val===o[0])+'">'+o[1]+'</button>'}).join('')+'</div>'}
function scaleHtml(val,act,pain,extra){var h='<div class="scale'+(pain?' pain':'')+'" role="group">';for(var i=0;i<=10;i++)h+='<button type="button" data-act="'+act+'" data-v="'+i+'"'+(extra||'')+' aria-pressed="'+pressed(val===i)+'">'+i+'</button>';return h+'</div>'}
function pernasMarcadas(d){return ['dir','esq'].filter(function(p){return Object.keys(d.faixas[p]).length>0})}
function resumoFaixas(f){
  var ks=Object.keys(f).map(Number).sort(function(a,b){return a-b});
  if(!ks.length)return 'nada marcado';
  var txt;
  if(ks.length===1) txt='faixa '+ks[0];
  else if(ks.length===2) txt='faixas '+ks[0]+' e '+ks[1];
  else if(ks[ks.length-1]-ks[0]===ks.length-1) txt='faixas '+ks[0]+' a '+ks[ks.length-1];
  else txt='faixas '+ks.slice(0,-1).join(', ')+' e '+ks[ks.length-1];
  if(ks.length>1){
    var max=Math.max.apply(null,ks.map(function(k){return f[k]}));
    var topo=ks.filter(function(k){return f[k]===max});
    if(topo.length===1) txt+=', mais forte na '+topo[0];
  }
  return txt;
}
var NOME_PERNA={dir:'Sua direita',esq:'Sua esquerda'};

// ---------- carregamento ----------
function localDB(){
  var KEY='tibia-demo-v1', data={}, subs=[];
  try{data=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){data={}}
  function pai(k){return k.split('/').slice(0,-1).join('/')}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){} subs.forEach(function(f){f()})}
  function snap(p){var d=data[p];return {id:p.split('/').pop(),exists:d!==undefined,data:function(){return d}}}
  function consulta(c,ord,lim){
    var docs=Object.keys(data).filter(function(k){return pai(k)===c}).map(snap);
    if(ord)docs.sort(function(a,b){return String(b.data()[ord]||'').localeCompare(String(a.data()[ord]||''))});
    docs=docs.slice(0,lim||1e9);
    return {docs:docs,empty:!docs.length,size:docs.length};
  }
  function doc(p){return {
    set:function(d){data[p]=JSON.parse(JSON.stringify(d));persist();return Promise.resolve()},
    onSnapshot:function(fn){var f=function(){fn(snap(p))};subs.push(f);setTimeout(f,0);return function(){}}
  }}
  function collection(c){var o={_o:null,_l:null,
    orderBy:function(f){o._o=f;return o},
    limit:function(n){o._l=n;return o},
    onSnapshot:function(fn){var f=function(){fn(consulta(c,o._o,o._l))};subs.push(f);setTimeout(f,0);return function(){}},
    add:function(d){data[c+'/'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)]=JSON.parse(JSON.stringify(d));persist();return Promise.resolve()}
  };return o}
  return {doc:doc,collection:collection,reset:function(){Object.keys(data).forEach(function(k){delete data[k]});persist()}};
}

async function init(){
  render();
  S.demo=true; S.db=localDB(); S.uid='demo';
  var base='registros/'+S.uid, db=S.db;
  db.doc(base).onSnapshot(function(s){S.perfil=s.exists?s.data():null;S.ready=true;render()});
  db.collection(base+'/treinos').orderBy('criadoEm','desc').limit(120).onSnapshot(function(q){S.treinos=q.docs.map(function(d){return d.data()});render()});
  db.collection(base+'/semanal').onSnapshot(function(q){var m={};q.docs.forEach(function(d){m[d.id]=d.data()});S.semanais=m;render()});

}
function semanaExemplo(){
  var base='registros/'+S.uid, hojeD=new Date();
  var plano=[[6,6.0,'rodagem',4,null],[5,null,null,null,'descanso'],[4,5.2,'rodagem',5,{4:1}],[3,7.0,'intervalado',7,{4:2,3:1}],[2,null,null,null,'descanso'],[1,8.0,'longo',6,{5:1,4:3,3:2}]];
  plano.forEach(function(p,i){

      t.descanso=false;t.distanciaKm=p[1];t.tempoMin=Math.round(p[1]*5.7);t.tipo=p[2];t.esforco=p[3];t.desconforto=!!p[4];

    }

  });

}
async function salvar(path,dados,depois){
  if(!S.db||!S.uid){S.error='Sem conexão com o armazenamento. Abra o app pelo link do claude.ai, com sua conta.';render();return}
  S.saving=true;S.error='';render();
  try{
    dados.criadoEm=new Date().toISOString();
    if(path.split('/').length%2===1) await S.db.collection(path).add(dados);
    else await S.db.doc(path).set(dados);
    S.saving=false; depois&&depois(); render();
  }catch(e){
    S.saving=false;
    if(e&&e.code==='invalid_argument'){S.readOnly=true;S.error='Sua conta não tem permissão para salvar aqui. Peça à equipe do projeto acesso de Contribuidor.'}
    else if(e&&e.code==='quota_exceeded'){S.error='O armazenamento do piloto está cheio. Avise a equipe do projeto.'}
    else{S.error='Não foi possível salvar agora. Confira sua conexão e tente de novo.'}
    render();
  }
}

  '<div style="display:flex;flex-direction:column;gap:8px" role="group">'+opts+'</div>'+
  (S.error?'<p class="err" role="alert">'+esc(S.error)+'</p>':'')+
  '<p class="note">Texto oficial do OSTRC-BR inserido após autorização dos autores.</p>'+
  '<div class="row"><button class="btn ghost" data-act="semVoltar">Voltar</button><button class="btn" data-act="semProx"'+(v==null||S.saving?' disabled':'')+'>'+(ult?(S.saving?'Enviando…':'Enviar respostas'):'Próxima')+'</button></div></section>'
}

function miniLeg(f){
  var h='<div class="mini"><svg viewBox="15 248 175 455" aria-hidden="true">'+LEG.replace(/stroke-width="2.2"/,'stroke-width="4"');
  for(var i=0;i<9;i++){var n=9-i,l=f[n]||0,y=Y0+i*STEP;var col=['rgba(255,255,255,.6)','#F7D9C8','#EDA27C','#B5532D'][l];h+='<rect x="59" y="'+y+'" width="56" height="'+H+'" rx="11.5" fill="'+col+'"></rect>'}
  return h+'</svg></div>'
}
function periodo(a,b){return a.getMonth()===b.getMonth()?a.getDate()+' a '+b.getDate()+' de '+MESES[b.getMonth()]:a.getDate()+' de '+MESES[a.getMonth()]+' a '+b.getDate()+' de '+MESES[b.getMonth()]}
function telaSemana(){
  var hojeD=new Date(), dias=[];
  for(var k=6;k>=0;k--){var d=new Date();d.setDate(hojeD.getDate()-k);dias.push(d)}
  var ini=isoLocal(dias[0]), fim=isoLocal(dias[6]);
  var regs=S.treinos.filter(function(t){return t.data>=ini&&t.data<=fim});
  var totalKm=0, treinos=0, comDor=0, agg={dir:{},esq:{}}, piorDor={dir:null,esq:null};
  var cel=dias.map(function(d){
    var iso=isoLocal(d), rs=regs.filter(function(t){return t.data===iso});
    var km=0, lv=-1, desc=false;
    rs.forEach(function(t){
      if(t.descanso){desc=true;return}
      treinos++; if(t.desconforto)comDor++;
      km+=num(t.distanciaKm)||0;
      var m=0; ['dir','esq'].forEach(function(p){if(t.pernas&&t.pernas[p]){var f=t.pernas[p].faixas||{};Object.keys(f).forEach(function(n){agg[p][n]=Math.max(agg[p][n]||0,f[n]);m=Math.max(m,f[n])});if(t.pernas[p].dor!=null)piorDor[p]=Math.max(piorDor[p]==null?0:piorDor[p],t.pernas[p].dor)}});
      lv=Math.max(lv,m);
    });
    totalKm+=km;
    var cls=lv>=0?'l'+lv:(desc?'rest':'');
    var lab=lv>=0?NIVEL[lv]:(desc?'descanso':'sem registro');
    return '<div class="day"><span>'+DIAS[d.getDay()]+'<br><b style="color:var(--ink);font-size:13px">'+d.getDate()+'</b></span><span class="p '+cls+'" role="img" aria-label="'+DIAS[d.getDay()]+': '+lab+'"></span><span class="km">'+(km?fmtKm(km):'–')+'</span></div>'
  }).join('');
  var pernasDor=['esq','dir'].filter(function(p){return Object.keys(agg[p]).length});
  var mapa=pernasDor.length?
    '<div class="card"><h2 style="font-size:17px">Onde doeu nesta semana</h2><div class="minis">'+pernasDor.map(function(p){return '<div style="display:flex;align-items:center;gap:10px">'+miniLeg(agg[p])+'<div><p style="font-weight:700">'+NOME_PERNA[p]+'</p><p class="lead" style="font-size:13px">'+resumoFaixas(agg[p])+'</p>'+(piorDor[p]!=null?'<p class="lead" style="font-size:13px">Pior dor da semana: '+piorDor[p]+' de 10</p>':'')+'</div></div>'}).join('')+'</div>'+
    '<p class="lead" style="font-size:13px">Desconforto em '+comDor+' de '+treinos+' treino'+(treinos===1?'':'s')+'.</p></div>':
    (treinos?'<div class="card"><h2 style="font-size:17px">Nenhum desconforto nesta semana</h2><p class="lead">'+treinos+' treino'+(treinos===1?'':'s')+' registrado'+(treinos===1?'':'s')+'.</p></div>':
    '<div class="card"><h2 style="font-size:17px">Nenhum treino registrado nesta semana</h2><p class="lead">Registre o próximo treino logo depois de terminar.</p><button class="btn" data-act="novo">Registrar treino</button></div>');
  var msg=S.msg?'<div class="card"><p class="eyebrow">Mensagem da clínica</p><p id="msgtxt"></p><p class="lead" style="font-size:12px" id="msgdata"></p></div>':'';
  return '<section class="screen" style="display:flex;flex-direction:column;gap:16px">'+
  '<div class="head"><p class="eyebrow">Minha semana</p><div class="linkrow"><h1>Últimos 7 dias</h1><span style="font-weight:700;color:var(--muted)">'+fmtKm(totalKm)+' km</span></div><p class="lead">'+periodo(dias[0],dias[6])+'</p></div>'+
  '<div class="card"><div class="days">'+cel+'</div><div class="legend"><span><i style="background:var(--surface);border:1px solid var(--faint)"></i>sem desconforto</span><span><i style="background:var(--p1)"></i>leve</span><span><i style="background:var(--p2)"></i>moderado</span><span><i style="background:var(--p3)"></i>forte</span><span><i style="background:var(--chip)"></i>descanso</span></div></div>'+
  mapa+msg+'</section>'
}

// ---------- render ----------
function render(){
  var html;
  if(!S.ready) html=telaCarregando();
  else if(!S.offline && !(S.perfil&&S.perfil.consentimento)) html=telaConsentimento();
  else switch(S.screen){
    case 'reg1': html=telaReg1(); break;
    case 'reg2': html=telaReg2(); break;
    case 'reg3': html=telaReg3(); break;
    case 'feito': html=telaFeito(); break;
    case 'semIntro': html=telaSemIntro(); break;
    case 'semQ': html=telaSemQ(); break;
    case 'semana': html=telaSemana(); break;
    default: html=telaHoje();
  }
  var foco=document.activeElement&&document.activeElement.id;
  app.innerHTML=html;
  if(S.msg){var mt=document.getElementById('msgtxt'),md=document.getElementById('msgdata');if(mt)mt.textContent=String(S.msg.texto||'');if(md&&S.msg.criadoEm){var dd=new Date(S.msg.criadoEm);md.textContent=isNaN(dd)?'':dd.getDate()+' de '+MESES[dd.getMonth()]}}
  if(foco){var el=document.getElementById(foco);if(el){el.focus();var v=el.value;el.value='';el.value=v}}
  var mostraTabs=S.ready&&(S.offline||(S.perfil&&S.perfil.consentimento))&&(S.screen==='hoje'||S.screen==='semana'||S.screen==='feito');
  tabs.style.display=mostraTabs?'flex':'none';
  tabs.querySelectorAll('.tab').forEach(function(t){if(t.dataset.to===S.screen)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current')});
}
function ir(scr){S.screen=scr;S.error='';render();window.scrollTo(0,0)}

// ---------- eventos ----------
app.addEventListener('input',function(e){
  if(!S.draft)return;
  if(e.target.id==='dist')S.draft.distancia=e.target.value;
  if(e.target.id==='tempo')S.draft.tempo=e.target.value;
  if(e.target.id==='dataTreino'){var v=e.target.value;if(v&&v>=diasAtras(6)&&v<=hoje()){S.draft.data=v;render();return}}
  if(S.screen==='reg1'){
    var ok=podeAvancar(S.draft);
    app.querySelectorAll('[data-act=sim],[data-act=naoDor]').forEach(function(b){b.disabled=!ok||S.saving});
    var fl=document.getElementById('falta'); if(fl)fl.textContent=faltaTxt(S.draft);
  }
});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b||b.disabled)return;
  var a=b.dataset.act, v=b.dataset.v, p=b.dataset.p, d=S.draft;
  switch(a){
    case 'go': ir(b.dataset.to); break;
    case 'aceitar':
      salvar('registros/'+S.uid,{consentimento:true,demo:true},function(){S.screen='hoje'});
      break;
    case 'novo': S.draft=novoDraft(); ir('reg1'); break;
    case 'novoOutroDia': S.draft=novoDraft(); S.draft.data=diasAtras(1); ir('reg1'); break;
    case 'exemplo': semanaExemplo(); ir('semana'); break;
    case 'limpar':
      if(window.confirm('Apagar todos os registros desta demonstração neste aparelho?')){S.db.reset();S.screen='hoje';S.draft=null;S.sem=null;render()}
      break;
    case 'descanso': if(registroNaData(hoje()))return; salvar('registros/'+S.uid+'/treinos',{data:hoje(),descanso:true,desconforto:false}); break;
    case 'tipo': d.tipo=v; render(); break;
    case 'outraData':
      d.outro=true; var livre=null; for(var k=0;k<=6;k++){if(!registroNaData(diasAtras(k))){livre=diasAtras(k);break}}
      if(livre)d.data=livre; render(); var di=document.getElementById('dataTreino'); if(di)di.focus(); break;
    case 'quandoTreino':
      if(v==='hoje'){d.data=hoje();d.outro=false}
      else if(v==='ontem'){d.data=diasAtras(1);d.outro=false}
      else {d.outro=true}
      render(); break;
    case 'esforco': d.esforco=+v; render(); break;
    case 'sim': if(!podeAvancar(d))return; ir('reg2'); break;
    case 'naoDor':
      if(!podeAvancar(d))return;
      salvar('registros/'+S.uid+'/treinos',montarTreino(false),function(){S.draft=null;S.screen='feito'}); break;
    case 'perna': d.perna=v; render(); break;
    case 'pincel': d.pincel=+v; render(); break;
    case 'faixa':
      var f=d.faixas[d.perna], n=+v;
      if(d.pincel===0||f[n]===d.pincel) delete f[n]; else f[n]=d.pincel;
      render();
      var nb=app.querySelector('.band[data-v="'+n+'"]'); if(nb)nb.focus();
      break;
    case 'voltar1': ir('reg1'); break;
    case 'cont2': ir('reg3'); break;
    case 'voltar2': ir('reg2'); break;
    case 'quando': d.quando=v; render(); break;
    case 'mudou': d.mudou=v; render(); break;
    case 'dor': d.dor[p]=+v; render(); break;
    case 'caminhar': d.caminhar[p]=v; render(); break;
    case 'inicio': d.inicio[p]=v; render(); break;
    case 'enviar':
      if(registroNaData(d.data))return;
      salvar('registros/'+S.uid+'/treinos',montarTreino(true),function(){S.draft=null;S.screen='feito'}); break;
    case 'semIntro': ir('semIntro'); break;
    case 'semComecar': S.sem={i:0,r:[null,null,null,null]}; ir('semQ'); break;
    case 'semOpt': S.sem.r[S.sem.i]=+v; render(); break;
    case 'semVoltar': if(S.sem.i===0)ir('semIntro'); else {S.sem.i--; render()} break;
    case 'semProx':
      if(S.sem.i<OSTRC.length-1){S.sem.i++; render(); window.scrollTo(0,0); break}
      var pts=S.sem.r.map(function(k,i){return OSTRC[i].pts[k]});
      var sem=isoWeek(new Date());
      salvar('registros/'+S.uid+'/semanal/'+sem,{semana:sem,respostas:S.sem.r.slice(),pontos:pts,gravidade:pts.reduce(function(a,b){return a+b},0),instrumento:'OSTRC-BR'},function(){S.sem=null;S.screen='hoje'});
      break;
  }
});
function montarTreino(comDor){
  var d=S.draft, t={data:d.data,descanso:false,distanciaKm:num(d.distancia),tempoMin:num(d.tempo),tipo:d.tipo,esforco:d.esforco,desconforto:comDor};
  if(comDor){
    t.quando=d.quando; t.mudouTreino=d.mudou; t.pernas={};
    pernasMarcadas(d).forEach(function(p){
      t.pernas[p]={faixas:Object.assign({},d.faixas[p]),dor:d.dor[p],caminhar:d.caminhar[p],inicio:semDorRecente(p)?d.inicio[p]:null};
    });
  }
  return t;
}

init();
})();
</script>
